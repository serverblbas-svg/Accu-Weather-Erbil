<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Countdown & Weather Overlay - Blue Theme</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent;
            color: #ffffff;
            font-family: 'Amiri', 'Tahoma', sans-serif;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .compact-box {
            position: absolute;
            bottom: 21px;
            left: 21px;
            background: #0212ed;
            padding: 16px 24px;
            border-radius: 14px;
            border: 1px solid rgba(33, 150, 243, 0.6);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 21px rgba(0, 0, 0, 0.6);
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
        }

        .main-time {
            font-family: 'Courier New', monospace;
            font-size: 21px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .city-tag {
            font-size: 21px;
            color: #f7f9fa;
            background: rgb(3, 21, 213);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: sans-serif;
            transition: opacity 0.5s ease-in-out;
            min-width: 50px;
            text-align: center;
            cursor: pointer;
        }

        .weather-info {
            font-size: 21px;
            color: #f8f9fa;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sub-details {
            font-size: 21px;
            color: #b0bec5;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .prayer-countdown {
            color: #fcfcfc;
            font-weight: bold;
            font-size: 21px;
        }

        .date-label {
            font-size: 21px;
            color: #90a4ae;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="compact-box">
        <div class="header-row">
            <div class="main-time">
                <span class="city-tag" id="cityTag">Iraq,Erbil</span>
                <span id="clockTime">00:00:00</span>
            </div>
            <div class="weather-info" id="weatherInfo">☀️ --°C</div>
        </div>

        <div class="info-group">
            <div class="sub-details">
                <span id="dateDisplay">-- - ---- - ----</span>

            </div>

        const PRAYER_NAMES = ['بەیانی', 'خۆرهەڵاتن', 'نیوەڕۆ', 'عەسر', 'ئێوارە', 'خەوتنان'];
        let showEBL = true;
        let showHijri = true;
        let hijriDateCache = null;

        // 🟢 فانکشنی وەرگرتنی ڕێکەوتی کۆچی لە APIـی ئەلادحان
        async function getHijriDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            
            try {
                const response = await fetch(
                    `https://api.aladhan.com/v1/gToH/${day}-${month}-${year}`
                );
                const data = await response.json();
                
                if (data.code === 210 && data.data) {
                    const hijri = data.data.hijri;
                    const dayName = hijri.day;
                    const monthName = hijri.month.ar;
                    const yearName = hijri.year;
                    return `${dayName} - ${monthName} - ${yearName} هـ`;
                } else {
                    throw new Error('API response invalid');
                }
            } catch (error) {
                console.warn('هەڵە لە وەرگرتنی ڕێکەوتی کۆچی، بە نزیکەیی هەژمار دەکرێت:', error);
                return getApproximateHijriDate(date);
            }
        }

        // 🟡 فانکشنی نزیکەیی بۆ کاتی نەبوونی ئینتەرنێت
        function getApproximateHijriDate(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            const hijriYear = Math.floor((year - 621) * 1.02169) + 1;
            const hijriMonth = Math.ceil((month * 0.919) + 0.2);
            let hijriDay = Math.ceil(day * 0.919) + 1;
            
            if (hijriDay > 21) {
                hijriDay = hijriDay - 21;
            }
            
            const monthNames = [
                'محەڕەم', 'سەفەر', 'ڕەبیع‌الئەووەل', 'ڕەبیع‌الثانی',
                'جەمادە‌لئوولا', 'جەمادە‌لئاخیرە', 'ڕەجەب', 'شەعبان',
                'ڕەمەزان', 'شەوال', 'زولقەعدە', 'زولحەججە'
            ];
            
            return `${hijriDay} - ${monthNames[(hijriMonth - 1) % 12]} - ${hijriYear} هـ`;
        }

        // 🟢 فانکشنی سەرەکی نوێکردنەوە
        async function updateData() {
            const now = new Date();
            let hours, minutes, seconds;
            let dateNow;

            if (showEBL) {
                hours = String(now.getHours()).padStart(2, '0');
                minutes = String(now.getMinutes()).padStart(2, '0');
                seconds = String(now.getSeconds()).padStart(2, '0');
                dateNow = now;
            } else {
                const gmtNow = new Date(now.toUTCString());
                hours = String(gmtNow.getUTCHours()).padStart(2, '0');
                minutes = String(gmtNow.getUTCMinutes()).padStart(2, '0');
                seconds = String(gmtNow.getUTCSeconds()).padStart(2, '0');
                dateNow = gmtNow;
            }

            document.getElementById('clockTime').textContent = `${hours}:${minutes}:${seconds}`;
            
            // 🟢 وەرگرتنی ڕێکەوتی کۆچی بە شێوەی ورد
            if (showHijri) {
                const hijriDate = await getHijriDate(dateNow);
                document.getElementById('dateDisplay').textContent = hijriDate;
                document.getElementById('dateTypeLabel').textContent = '(کۆچی)';
            } else {
                document.getElementById('dateDisplay').textContent = dateNow.toLocaleDateString('en-GB');
                document.getElementById('dateTypeLabel').textContent = '(زایینی)';
            }

            // 🟢 هەژمارکردنی ماوەی نوێژ
            const key = `${now.getMonth() + 1}_${now.getDate()}`;
            if (PRAYER_DATA[key]) {
                const times = PRAYER_DATA[key].split('|').map(t => {
                    const p = t.split(':');
                    return parseInt(p[0], 10) * 3600 + parseInt(p[1], 10) * 60;
                });

                const nowSecs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                let nextIdx = -1;
                let diffSecs = 0;

                for (let i = 0; i < times.length; i++) {
                    if (nowSecs < times[i]) {
                        nextIdx = i;
                        diffSecs = times[i] - nowSecs;
                        break;
                    }
                }

                if (nextIdx !== -1) {
                    const h = Math.floor(diffSecs / 3600);
                    const m = Math.floor((diffSecs % 3600) / 60);
                    const s = diffSecs % 60;
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                    document.getElementById('prayerCountdown').textContent = `بۆ ${PRAYER_NAMES[nextIdx]}: ${timeStr} ماوە`;
                } else {
                    const firstPrayerSecs = times[0];
                    diffSecs = (24 * 3600 - nowSecs) + firstPrayerSecs;
                    const h = Math.floor(diffSecs / 3600);
                    const m = Math.floor((diffSecs % 3600) / 60);
                    const s = diffSecs % 60;
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                    document.getElementById('prayerCountdown').textContent = `بۆ بەیانی: ${timeStr} ماوە`;
                }
            }
        }

        // 🟢 گۆڕینی نێوان EBL/GMT و کۆچی/زایینی
        function toggleData() {
            const cityTag = document.getElementById('cityTag');
            cityTag.style.opacity = '0';
            setTimeout(() => {
                showEBL = !showEBL;
                cityTag.textContent = showEBL ? 'EBL' : 'GMT';
                showHijri = !showHijri;
                updateData();
                cityTag.style.opacity = '1';
            }, 500);
        }

        // 🟢 وەرگرتنی کەش و هەوا
        async function updateWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.1911&longitude=44.0091&current=temperature_2m,weather_code');
                const data = await response.json();
                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;

                let emoji = '☀️';
                if (code >= 1 && code <= 3) emoji = '⛅';
                else if (code >= 45 && code <= 48) emoji = '🌫️';
                else if (code >= 51 && code <= 67) emoji = '🌧️';
                else if (code >= 71 && code <= 77) emoji = '❄️';
                else if (code >= 95) emoji = '⛈️';

                document.getElementById('weatherInfo').textContent = `${emoji} ${temp}°C`;
            } catch (e) {
                document.getElementById('weatherInfo').textContent = `🌤️ --°C`;
            }
        }

        // 🔁 دەستپێکردن
        setInterval(updateData, 1000);
        updateData();

        document.getElementById('cityTag').addEventListener('click', toggleData);

        updateWeather();
        setInterval(updateWeather, 600000);
