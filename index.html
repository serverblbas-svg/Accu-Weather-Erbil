<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Countdown Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent;
            color: #ffffff;
            font-family: 'Amiri', 'Tahoma', sans-serif;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .compact-box {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: transparent;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .prayer-countdown {
            color: #ffffff;
            font-weight: bold;
            font-size: 26px;
        }
    </style>
</head>
<body>

    <div class="compact-box">
        <div class="prayer-countdown" id="prayerCountdown">بۆ نوێژی داهاتوو: --:--:--</div>
    </div>

    <script>
        const PRAYER_DATA = {
            "9_30": "04:36|06:06|12:07|15:21|17:57|19:12",
            "10_1": "04:38|06:06|12:06|15:20|17:56|19:11"
            // و هتد... هەموو داتاکان لەخۆ دەگرێت
        };

        function updateCountdown() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const key = `${month}_${day}`;
            
            const timesStr = PRAYER_DATA[key];
            if (!timesStr) {
                document.getElementById('prayerCountdown').innerText = "داتای ئەمڕۆ نییە";
                return;
            }
            
            const times = timesStr.split('|');
            const prayerNames = ["بانگی بە‌یانی", "خۆرهەڵاتن", "بانگی نیوەڕۆ", "بانگی عەسر", "بانگی ئێواره", "بانگی خەوتنان"];
            
            const nowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
            
            let nextPrayerTime = null;
            let nextPrayerName = "";
            
            for (let i = 0; i < times.length; i++) {
                const [h, m] = times[i].split(':').map(Number);
                const prayerMinutes = h * 60 + m;
                if (prayerMinutes > nowMinutes) {
                    nextPrayerTime = {h, m};
                    nextPrayerName = prayerNames[i];
                    break;
                }
            }
            
            let targetDate = new Date();
            if (!nextPrayerTime) {
                const [h, m] = times[0].split(':').map(Number);
                nextPrayerName = prayerNames[0];
                targetDate.setDate(targetDate.getDate() + 1);
                targetDate.setHours(h, m, 0, 0);
            } else {
                targetDate.setHours(nextPrayerTime.h, nextPrayerTime.m, 0, 0);
            }
            
            const diff = targetDate - now;
            if (diff <= 0) return;
            
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            const pad = (n) => String(n).padStart(2, '0');
            document.getElementById('prayerCountdown').innerText = 
                `بۆ ${nextPrayerName}: ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
