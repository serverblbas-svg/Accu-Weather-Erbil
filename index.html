            display: flex;

            align-items: center;

            font-size: 42px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 4px 0;
            color: #111111;
        }
        .label {
            font-size: 14px;
            color: #666666;
        }
        .countdown-box {
            background: #fff3e0; /* زەردێکی کاڵ و سەرنجڕاکێش */
            color: #e65100;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ffe0b2;
        }
    </style>
</head>

            "12-26": {"Fajr": "06:21", "Sunrise": "07:19", "Dhuhr": "12:14", "Asr": "14:32", "Maghrib": "16:58", "Isha": "18:18"},
            "12-27": {"Fajr": "06:00", "Sunrise": "07:19", "Dhuhr": "12:16", "Asr": "14:42", "Maghrib": "17:02", "Isha": "18:17"},
            "12-28": {"Fajr": "06:01", "Sunrise": "07:19", "Dhuhr": "12:16", "Asr": "14:43", "Maghrib": "17:03", "Isha": "18:18"},
            "12-29": {"Fajr": "06:01", "Sunrise": "07:20", "Dhuhr": "12:16", "Asr": "14:43", "Maghrib": "17:03", "Isha": "18:18"},
            "12-30": {"Fajr": "06:02", "Sunrise": "07:20", "Dhuhr": "12:17", "Asr": "14:44", "Maghrib": "17:04", "Isha": "18:19"},
            "12-31": {"Fajr": "06:02", "Sunrise": "07:20", "Dhuhr": "12:17", "Asr": "14:45", "Maghrib": "17:05", "Isha": "18:20"}
        };

        let showGMT = false;

        function updateClock() {
            const now = new Date();
            let timeString = '';
            
            if (showGMT) {
                timeString = now.toUTCString().slice(17, 25);
                document.getElementById('labelDisplay').innerText = 'کاتی GMT';
            } else {
                let hours = String(now.getHours()).padStart(2, '0');
                let minutes = String(now.getMinutes()).padStart(2, '0');
                let seconds = String(now.getSeconds()).padStart(2, '0');
                timeString = `${hours}:${minutes}:${seconds}`;
                document.getElementById('labelDisplay').innerText = 'کاتی خۆجێی (Local Time)';
            }
            
            document.getElementById('clockDisplay').innerText = timeString;

            updateCountdown(now);
        }

        function updateCountdown(now) {
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const key = `${month}-${day}`;
            
            const timings = prayerData[key] || prayerData["1-1"];

            const prayers = [
                { name: 'بەیانی', time: timings.Fajr },
                { name: 'خۆرپەرژە', time: timings.Sunrise },
                { name: 'نیوەڕۆ', time: timings.Dhuhr },
                { name: 'عەسر', time: timings.Asr },
                { name: 'مەغریب', time: timings.Maghrib },
                { name: 'عیشا', time: timings.Isha }
            ];

            let nextPrayer = null;
            let minDiff = Infinity;
            let currentTimeSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

            for (let p of prayers) {
                let [pHour, pMin] = p.time.split(':').map(Number);
                let pTimeSec = pHour * 3600 + pMin * 60;
                
                let diff = pTimeSec - currentTimeSec;
                if (diff > 0 && diff < minDiff) {
                    minDiff = diff;
                    nextPrayer = p;
                }
            }

            if (!nextPrayer) {
                let [pHour, pMin] = prayers[0].time.split(':').map(Number);
                let pTimeSec = pHour * 3600 + pMin * 60;
                minDiff = (24 * 3600 - currentTimeSec) + pTimeSec;
                nextPrayer = prayers[0];
            }

            let h = Math.floor(minDiff / 3600);
            let m = Math.floor((minDiff % 3600) / 60);
            let s = minDiff % 60;

            let hStr = String(h).padStart(2, '0');
            let mStr = String(m).padStart(2, '0');
            let sStr = String(s).padStart(2, '0');

            document.getElementById('countdownDisplay').innerText = `بۆ بانگی ${nextPrayer.name}: ${hStr}:${mStr}:${sStr}`;
        }

        // نوێکردنەوەی چرکە بە چرکە
        setInterval(updateClock, 1000);
        updateClock();

        // گۆڕانکاری نێوان کاتی خۆجێی و GMT هەر ٥ چرکە جارێک
        setInterval(() => {
            showGMT = !showGMT;
        }, 5000);
    </script>
